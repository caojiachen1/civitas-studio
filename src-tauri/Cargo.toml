[package]
name = "civitas-studio"
version = "0.3.0"
description = "Civitas Studio - a 3D city and building construction studio"
authors = ["Civitas Studio"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "civitas_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["time"] }
